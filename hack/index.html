<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulador de Hack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      overflow: hidden;
    }

    .terminal {
      padding: 20px;
      white-space: pre-wrap;
      height: 100vh;
      overflow-y: auto;
    }

    .blinking {
      animation: blink 1s step-start 0s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* Efeito de ruído / distorção como terminal */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 255, 0, 0.03) 0px,
        rgba(0, 255, 0, 0.03) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 999;
      animation: flicker 0.2s infinite;
    }

    @keyframes flicker {
      0% { opacity: 0.9; }
      50% { opacity: 1; }
      100% { opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div class="terminal" id="terminal"></div>

  <!-- Som de digitação -->
  <audio id="digito" src="https://www.soundjay.com/button/sounds/button-16.mp3" preload="auto"></audio>

  <script>
    const terminal = document.getElementById('terminal');
    const digito = document.getElementById('digito');

    const linhas = [
      "Iniciando acesso ao sistema...",
      "Verificando porta 443... [OK]",
      "Bypass de autenticação de 2 fatores...",
      "Token de cartão localizado...",
      "Clonando cartão... ██████████ 100%",
      "Extraindo credenciais salvas...",
      "Hash MD5 encontrado: 5f4dcc3b5aa765d61d8327deb882cf99",
      "Descriptografando senha: ********",
      "Conexão com servidor remoto estabelecida.",
      "Injetando payload...",
      "Escaneando sistema de arquivos...",
      "Baixando dados confidenciais...",
      "Upload para servidor externo em andamento...",
      "Apagando rastros...",
      "Desconectando do sistema...",
      "Hack concluído com sucesso."
    ];

    let index = 0;

    function digitarLinha(texto, delay = 40, callback) {
      let i = 0;
      const intervalo = setInterval(() => {
        if (i < texto.length) {
          terminal.innerHTML += texto[i++];
          digito.currentTime = 0;
          digito.play().catch(() => {}); // previne erro de autoplay bloqueado
        } else {
          clearInterval(intervalo);
          terminal.innerHTML += "\n";
          terminal.scrollTop = terminal.scrollHeight;

          // Vibra em eventos específicos
          if (texto.includes("payload") || texto.includes("senha")) {
            if (navigator.vibrate) {
              navigator.vibrate([200, 100, 200]);
            }
          }

          if (callback) callback();
        }
      }, delay);
    }

    function processarProximaLinha() {
      if (index < linhas.length) {
        digitarLinha(linhas[index], 30, () => {
          index++;
          setTimeout(processarProximaLinha, 300);
        });
      } else {
        terminal.innerHTML += "\n\n> <span class='blinking'>█</span>";
      }
    }

    // Tela cheia ao primeiro clique/tap
    function ativarTelaCheia() {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    }
    document.addEventListener("click", ativarTelaCheia, { once: true });

    // Impede sair com botão voltar
    history.pushState(null, null, location.href);
    window.onpopstate = () => {
      history.go(1);
    };

    // Inicia simulação
    processarProximaLinha();
  </script>
</body>
</html>
