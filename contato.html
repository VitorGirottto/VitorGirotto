<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="icon" href="image.png" type="image/png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contato - Vitor Girotto</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      background: radial-gradient(
          200% 100% at 50% 100%,
          #191217 55%,
          #251f2d 62%,
          transparent
        ),
        radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 0px) center / 40px 10px,
        #111;
      color: white;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      position: absolute;
      width: 100%;
      top: 0;
      z-index: 10;
      flex-wrap: wrap;
    }

    .logo {
      font-weight: bold;
      font-size: 24px;
      background: linear-gradient(45deg, #610459, #770286);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      transition: transform 0.3s ease, text-shadow 0.3s ease;
    }

    .logo:hover {
      transform: scale(1.1);
      text-shadow: 0 0 10px #d400ff;
    }

    nav {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      position: relative;
      transition: color 0.3s ease, transform 0.2s ease;
    }

    nav a::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 2px;
      left: 0;
      bottom: -4px;
      background: #75008d;
      transition: width 0.3s ease;
    }

    nav a:hover {
      color: #75008d;
      transform: scale(1.05);
    }

    nav a:hover::after {
      width: 100%;
    }

    .main-section {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
      perspective: 1000px;
      z-index: 1;
      text-align: center;
      flex-direction: column;
      padding: 0 20px;
    }

    .social-links {
      font-size: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      font-weight: bold;
    }

    .social-links a {
      color: #d900ff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: color 0.3s ease;
    }

    .social-links a:hover {
      color: #ff5cff;
    }

    .social-links i {
      font-size: 28px;
      min-width: 28px;
    }

    /* Efeito 3D ao passar o mouse (para o container das redes sociais) */
    .social-links:hover {
      cursor: pointer;
      animation: none;
    }

    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: transparent;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: blink 2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .shooting-stars {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .shooting-star {
      position: absolute;
      width: 2px;
      height: 120px;
      background: linear-gradient(to bottom, white, transparent);
      opacity: 0;
      transform: rotate(45deg);
      animation: shoot 1s linear forwards;
    }

    @keyframes shoot {
      0% {
        opacity: 1;
        transform: translate(0, 0) rotate(45deg);
      }
      100% {
        opacity: 0;
        transform: translate(-500px, 500px) rotate(45deg);
      }
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: center;
        padding: 10px 20px;
      }

      .logo {
        font-size: 20px;
        margin-bottom: 10px;
      }

      nav {
        gap: 15px;
      }

      nav a {
        font-size: 16px;
      }

      .social-links {
        font-size: 20px;
      }

      .social-links i {
        font-size: 24px;
        min-width: 24px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" onclick="window.location.href='index.html'">Vitor Girotto</div>
    <nav>
      <a href="index.html">Sobre</a>
      <a href="assuntos.html">Assuntos</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <section class="main-section">
    <div class="social-links">
      <a href="tel:+5549988960558"><i class="fas fa-phone-alt"></i>+55 49 98896-0558</a>
      <a href="https://github.com/VitorGirottto" target="_blank" rel="noopener"><i class="fab fa-github"></i>github.com/VitorGirottto</a>
      <a href="https://www.instagram.com/vitor__jpg" target="_blank" rel="noopener"><i class="fab fa-instagram"></i>@vitor__jpg</a>
      <a href="https://www.linkedin.com/in/vitor-junior-da-paz-girotto" target="_blank" rel="noopener"><i class="fab fa-linkedin"></i>in/vitor-junior-da-paz-girotto</a>
      <a href="mailto:vjpgvjpgvjpgvjpg@gmail.com"><i class="fas fa-envelope"></i>vjpgvjpgvjpgvjpg@gmail.com</a>
    </div>
  </section>

  <div class="stars" id="stars-container"></div>
  <div class="shooting-stars" id="shootingStars"></div>

  <script>
    const starContainer = document.getElementById('stars-container');
    for (let i = 0; i < 120; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      star.style.top = `${Math.random() * 100}%`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.animationDelay = `${Math.random() * 5}s`;
      starContainer.appendChild(star);
    }

    // Estrelas cadentes contínuas
    const shootingStarsContainer = document.getElementById('shootingStars');
    function createShootingStar() {
      const star = document.createElement('div');
      star.classList.add('shooting-star');
      star.style.top = `${Math.random() * window.innerHeight}px`;
      star.style.left = `${Math.random() * window.innerWidth}px`;
      shootingStarsContainer.appendChild(star);
      setTimeout(() => star.remove(), 1000);
    }

    function launchRandomShootingStar() {
      createShootingStar();
      const next = Math.random() * 400 + 100;
      setTimeout(launchRandomShootingStar, next);
    }

    launchRandomShootingStar();
  </script>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
