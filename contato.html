<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Vitor Girotto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: #f8f8f8;
            color: #333;
            line-height: 1.6;
            padding: 40px;
        }

        header {
            display: flex;
            justify-content: center;
            margin-bottom: 50px;
        }

        nav {
            display: flex;
            gap: 40px;
            font-weight: bold;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-size: 18px;
            position: relative;
        }

        nav a:hover::after {
            content: "";
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #4e73df;
            transition: 0.3s;
        }

        .content {
            text-align: center;
        }

        footer {
            margin-top: 50px;
            text-align: center;
            font-size: 14px;
            color: #777;
        }

        .contact-info {
            margin-top: 30px;
            font-size: 18px;
        }

        .contact-info p {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-weight: bold;
            color: #333;
        }

        .contact-info a {
            text-decoration: none;
            color: #333;
            font-size: 18px;
            display: flex;
            align-items: center;
        }

        .contact-info a:hover {
            color: #4e73df;
        }

        .contact-info i {
            font-size: 24px;
            margin-right: 10px;
            color: #4e73df;
        }

        .contact-info a:hover i {
            color: #2a47b0;
        }
    </style>
</head>
<body>
