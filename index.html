

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vitor Girotto</title>
  <link rel="stylesheet" href="style.css" />
  <style>
      * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      background: linear-gradient(to bottom, #0b0e21, #151a35);
      color: white;
      overflow: hidden;
      position: relative;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      position: absolute;
      width: 100%;
      top: 0;
      z-index: 10;
      flex-wrap: wrap;
    }

    .logo {
      font-weight: bold;
      font-size: 24px;
      background: linear-gradient(45deg, #610459, #770286);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      transition: transform 0.3s ease, text-shadow 0.3s ease;
    }

    .logo:hover {
      transform: scale(1.1);
      text-shadow: 0 0 10px #d400ff;
    }

    nav {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      position: relative;
      transition: color 0.3s ease, transform 0.2s ease;
    }

    nav a::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 2px;
      left: 0;
      bottom: -4px;
      background: #2caefe;
      transition: width 0.3s ease;
    }

    nav a:hover {
      color: #2caefe;
      transform: scale(1.05);
    }

    nav a:hover::after {
      width: 100%;
    }

    .main-section {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
      perspective: 1000px;
      z-index: 1;
      text-align: center;
    }

    .php-effect {
      font-size: 150px;
      font-weight: bold;
      background: linear-gradient(45deg, #9e029e, #5f024c, #210055);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rotate3D 10s infinite linear;
      transition: transform 0.1s ease;
      cursor: pointer;
      text-shadow: 0 0 10px rgba(255,255,255,0.2);
      display: inline-block;
    }

    @keyframes rotate3D {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }

    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: transparent;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: blink 2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    /* PLANETAS ORBITANDO */
    .orbit-container {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 600px;
      height: 600px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .planet {
      position: absolute;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, #1c056d, #460664);
      border-radius: 50%;
      box-shadow: 0 0 20px #d400ff;
      animation: orbit 20s linear infinite;
    }

    .orbit1 {
      animation-duration: 25s;
    }

    .orbit2 {
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, #ad02e0, #5b05ac);
      animation-duration: 40s;
      transform-origin: -150px -150px;
      box-shadow: 0 0 15px #3b2537;
    }

    @keyframes orbit {
      from { transform: rotate(0deg) translateX(200px) rotate(0deg); }
      to   { transform: rotate(360deg) translateX(200px) rotate(-360deg); }
    }

    /* GALÁXIA GIRANDO */
    .galaxy {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255,255,255,0.3), transparent 70%);
      border-radius: 50%;
      top: 80%;
      left: 90%;
      transform: translate(-50%, -50%);
      animation: spinGalaxy 90s linear infinite;
      z-index: 0;
      box-shadow: 0 0 80px rgba(255,255,255,0.2);
    }

    @keyframes spinGalaxy {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* ESTRELAS CADENTES */
    .shooting-stars {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .shooting-star {
      position: absolute;
      width: 2px;
      height: 120px;
      background: linear-gradient(to bottom, white, transparent);
      opacity: 0;
      transform: rotate(45deg);
      animation: shoot 1s linear forwards;
    }

    @keyframes shoot {
      0% {
        opacity: 1;
        transform: translate(0, 0) rotate(45deg);
      }
      100% {
        opacity: 0;
        transform: translate(-500px, 500px) rotate(45deg);
      }
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: center;
        padding: 10px 20px;
      }

      .logo {
        font-size: 20px;
        margin-bottom: 10px;
      }

      nav {
        gap: 15px;
      }

      nav a {
        font-size: 16px;
      }

      .php-effect {
        font-size: 80px;
      }

      .galaxy, .orbit-container {
        display: none;
      }
    }@use "sass:list";
@use "sass:math";
@use "sass:color";

@property --y {
  syntax: "<length>";
  initial-value: 0;
  inherits: true;
}

@property --x {
  syntax: "<length>";
  initial-value: 0;
  inherits: true;
}

@property --p {
  syntax: "<percentage>";
  initial-value: 0%;
  inherits: true;
}

$sceneWidth: 160px;
$sceneHeight: 100px;
$baseColor: #630a57;
$horizont: 22px;

// Funções utilitárias omitidas por clareza (mesmas que você enviou)

@function cityscape() {
  $result: ();
  $data: ();
  $cx: $sceneWidth / 2px;
  $cy: $sceneHeight / 2px;
  $wd: 20;

  $data: (
    ($m6, $cx - $wd, $cy + 50),
    ($m1, $cx + $wd, $cy + 50),
    ($m1, $cx - $wd, $cy + 30),
    ($m2, $cx - $wd - 10, $cy + 26),
    ($m1, $cx - $wd - 30, $cy + 20),
    ($m4, $cx - $wd - 40, $cy + 10),
    ($m4, $cx + $wd + 30, $cy + 40),
    ($m1, $cx + $wd, $cy),
    ($m1, $cx - $wd - 10, $cy - 10),
    ($m1, $cx + $wd, $cy - 20),
    ($m2, $cx + $wd + 4, $cy - 25),
    ($m1, $cx - $wd, $cy - 30),
    ($m3, $cx + $wd + 30, $cy - 40),
    ($m2, $cx - $wd - 20, $cy - 42),
    ($m3, $cx - $wd - 20, $cy - 45),
    ($m1, $cx - $wd - 10, $cy - 50),
    ($m5, $cx + $wd + 30, $cy - 54)
  );

  @for $i from 1 through length($data) {
    $item: nth($data, $i);
    $m: nth($item, 1);
    $x: nth($item, 2);
    $y: nth($item, 3);
    $result: list.append(
      $result,
      elevation($m, $x * 1px, $y * 1px - 100px),
      "comma"
    );
    $result: list.append($result, elevation($m, $x * 1px, $y * 1px), "comma");
  }
  @return $result;
}

@function rocketScene() {
  $c: #b2a8d5;
  $c2: #ea35f7;
  $c3: transparent;
  $r: (
    part((1px, 1px, $sceneWidth / 2, $sceneHeight/2 + 21px, $c, $c3)),
    part((3px, 4px, $sceneWidth / 2 - 1px, $sceneHeight/2 + 20px, $c, $c3)),
    part((1px, 2px, $sceneWidth / 2-1.6px, $sceneHeight/2 + 21px, $c, $c3)),
    part((1px, 2px, $sceneWidth / 2+1.6px, $sceneHeight/2 + 21px, $c, $c3)),
    part((1px, 3px, $sceneWidth / 2, $sceneHeight/2 + 24px, $c, $c3)),
    part((1px, 1px, $sceneWidth / 2 - 1px, $sceneHeight/2 + 25px, $c, $c3)),
    part((1px, 1px, $sceneWidth / 2 + 1px, $sceneHeight/2 + 25px, $c, $c3)),
    part((1px, 4px, $sceneWidth / 2 - 1.5px, $sceneHeight/2 + 24.5px, $c, $c3)),
    part((1px, 4px, $sceneWidth / 2 + 1.5px, $sceneHeight/2 + 24.5px, $c, $c3)),
    part((1px, 1.5px, $sceneWidth / 2 + 1.5px, $sceneHeight/2 + 28.5px, $c2, transparent var(--p))),
    part((1px, 1.5px, $sceneWidth / 2 - 1.5px, $sceneHeight/2 + 28.5px, $c2, transparent var(--p)))
  );
  @return $r;
}

@function makeStar($item) {
  $w: list.nth($item, 1);
  $h: list.nth($item, 2);
  $x: list.nth($item, 3);
  $y: list.nth($item, 4);
  $c: list.nth($item, 5);

  @return linear-gradient(to right, $c, transparent) #{$x} calc(
      #{$y} + var(--y)
    ) / #{$w} #{$h};
}

@function generateStars() {
  $r: ();
  @for $i from 0 through 100 {
    $star: makeStar(
      (
        #{random(2) * 1px},
        #{random(5) * 1px},
        #{random(100) * 1%},
        #{random(50) * 1%},
        white
      )
    );
    $r: append($r, $star, comma);
  }
  @return $r;
}

@function starsBackground() {
  @return generateStars();
}


@keyframes move {
  from {
    --p: 100%;
  }
  30%, 70% {
    --x: 1px;
  }
  20%, 22%, 44%, 46%, 48% {
    --p: 100%;
  }
  21%, 45%, 47% {
    --p: 0%;
  }
  40%, 80% {
    --x: -1px;
  }
  to {
    --y: 100px;
    --x: 0px;
    --p: 100%;
  }
}

@keyframes stars-move {
  from {
    opacity: 0;
  }
  5%, 95% {
    opacity: 1;
  }
  to {
    --y: -100px;
    opacity: 0;
  }
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  height: 100dvh;
  margin: 0;
  background: radial-gradient(
      200% 100% at 50% 100%,
      #191217 55%,
      #251f2d 62%,
      transparent
    ),
    radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 0px) center / 40px 10px,
    #111;
  overflow: hidden;

  &:before {
    pointer-events: none;
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    mask: linear-gradient(black, transparent 50%);
    background: starsBackground();
    animation: stars-move 5s linear infinite;
    background-repeat: no-repeat;
  }

  &:after {
    pointer-events: none;
    content: "";
    position: absolute;
    inset: 0;
    mask: linear-gradient(to top, black, transparent 20%, transparent);
    z-index: 1;
    backdrop-filter: blur(2rem);
  }
}

* {
  box-sizing: border-box;
}

  </style>
</head>
<body>
  <header>
    <div class="logo" onclick="window.location.href='index.html'">Vitor Girotto</div>
    <nav>
      <a href="index.html">Sobre</a>
      <a href="assuntos.html">Assuntos</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <section class="main-section">
    <span class="php-effect" id="phpText">PHP</span>
  </section>

  <div class="stars" id="stars-container"></div>

  <div class="orbit-container">
    <div class="planet orbit1"></div>
    <div class="planet orbit2"></div>
  </div>

<div class="universe-bg"></div>
  <div class="shooting-stars" id="shootingStars"></div>

  <script>
    const starContainer = document.getElementById('stars-container');
    for (let i = 0; i < 120; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      star.style.top = `${Math.random() * 100}%`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.animationDelay = `${Math.random() * 5}s`;
      starContainer.appendChild(star);
    }

    // Movimento com mouse
    const phpText = document.getElementById('phpText');
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 30;
      const y = (e.clientY / window.innerHeight - 0.5) * -30;
      phpText.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
    });

    // Estrelas cadentes contínuas
    const shootingStarsContainer = document.getElementById('shootingStars');
    function createShootingStar() {
      const star = document.createElement('div');
      star.classList.add('shooting-star');
      star.style.top = `${Math.random() * window.innerHeight}px`;
      star.style.left = `${Math.random() * window.innerWidth}px`;
      shootingStarsContainer.appendChild(star);
      setTimeout(() => star.remove(), 1000);
    }

    function launchRandomShootingStar() {
      createShootingStar();
      const next = Math.random() * 400 + 100 ;
      setTimeout(launchRandomShootingStar, next);
    }

    launchRandomShootingStar();
  </script>
</body>
</html>
