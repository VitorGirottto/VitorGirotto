<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vitor Girotto</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      background: linear-gradient(to bottom, #0b0e21, #151a35);
      color: white;
      overflow-x: hidden;
      position: relative;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      position: absolute;
      width: 100%;
      top: 0;
      z-index: 10;
    }

    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-size: 16px;
    }

    .logo {
      font-weight: bold;
      font-size: 20px;
    }

    .main-section {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 100px 50px 50px;
      min-height: 100vh;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .php-effect {
      font-size: 100px;
      font-weight: bold;
      background: linear-gradient(45deg, #2caefe, #ff00cc, #00ffe1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulse 3s infinite;
      transition: all 0.5s ease;
      cursor: pointer;
    }

    .php-effect:hover {
      transform: scale(1.2) rotate(5deg);
      filter: drop-shadow(0 0 10px #2caefe);
      animation: hueRotate 5s infinite linear;
    }

    @keyframes pulse {
      0%, 100% {
        text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
      }
      50% {
        text-shadow: 0 0 20px #2caefe, 0 0 40px #2caefe;
      }
    }

    @keyframes hueRotate {
      0% {
        filter: hue-rotate(0deg);
      }
      100% {
        filter: hue-rotate(360deg);
      }
    }

    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: transparent;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: blink 2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    @media (max-width: 768px) {
      .php-effect {
        font-size: 60px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Vitor Girotto</div>
    <nav>
      <a href="index.html">Sobre</a>
      <a href="assuntos.html">Assuntos</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <section class="main-section">
    <div>
      <span class="php-effect">PHP</span>
    </div>
  </section>

  <div class="stars" id="stars-container"></div>

  <script>
    // Gerador de estrelas
    const starContainer = document.getElementById('stars-container');
    for (let i = 0; i < 120; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      star.style.top = `${Math.random() * 100}%`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.animationDelay = `${Math.random() * 5}s`;
      starContainer.appendChild(star);
    }
  </script>
</body>
</html>
