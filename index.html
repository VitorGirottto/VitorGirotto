<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vitor Girotto</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      background: linear-gradient(to bottom, #0b0e21, #151a35);
      color: white;
      overflow: hidden;
      position: relative;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      position: absolute;
      width: 100%;
      top: 0;
      z-index: 10;
      flex-wrap: wrap;
    }

    .logo {
      font-weight: bold;
      font-size: 24px;
      background: linear-gradient(45deg, #00ffe1, #2caefe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      transition: transform 0.3s ease, text-shadow 0.3s ease;
    }

    .logo:hover {
      transform: scale(1.1);
      text-shadow: 0 0 10px #00ffe1;
    }

    nav {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      position: relative;
      transition: color 0.3s ease, transform 0.2s ease;
    }

    nav a::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 2px;
      left: 0;
      bottom: -4px;
      background: #2caefe;
      transition: width 0.3s ease;
    }

    nav a:hover {
      color: #2caefe;
      transform: scale(1.05);
    }

    nav a:hover::after {
      width: 100%;
    }

    .main-section {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
      perspective: 1000px;
      z-index: 1;
      text-align: center;
    }

    .php-effect {
      font-size: 150px;
      font-weight: bold;
      background: linear-gradient(45deg, #2caefe, #ff00cc, #00ffe1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rotate3D 10s infinite linear;
      transition: transform 0.1s ease;
      cursor: pointer;
      text-shadow: 0 0 10px rgba(255,255,255,0.2);
      display: inline-block;
    }

    @keyframes rotate3D {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }

    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: transparent;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: blink 2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    /* PLANETAS ORBITANDO */
    .orbit-container {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 600px;
      height: 600px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .planet {
      position: absolute;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, #00ffe1, #2caefe);
      border-radius: 50%;
      box-shadow: 0 0 20px #00ffe1;
      animation: orbit 20s linear infinite;
    }

    .orbit1 {
      animation-duration: 25s;
    }

    .orbit2 {
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, #ff00cc, #2caefe);
      animation-duration: 40s;
      transform-origin: -150px -150px;
      box-shadow: 0 0 15px #ff00cc;
    }

    @keyframes orbit {
      from { transform: rotate(0deg) translateX(200px) rotate(0deg); }
      to   { transform: rotate(360deg) translateX(200px) rotate(-360deg); }
    }

    /* GALÁXIA GIRANDO */
    .galaxy {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255,255,255,0.3), transparent 70%);
      border-radius: 50%;
      top: 80%;
      left: 90%;
      transform: translate(-50%, -50%);
      animation: spinGalaxy 90s linear infinite;
      z-index: 0;
      box-shadow: 0 0 80px rgba(255,255,255,0.2);
    }

    @keyframes spinGalaxy {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* ESTRELAS CADENTES */
    .shooting-stars {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .shooting-star {
      position: absolute;
      width: 2px;
      height: 120px;
      background: linear-gradient(to bottom, white, transparent);
      opacity: 0;
      transform: rotate(45deg);
      animation: shoot 1s linear forwards;
    }

    @keyframes shoot {
      0% {
        opacity: 1;
        transform: translate(0, 0) rotate(45deg);
      }
      100% {
        opacity: 0;
        transform: translate(-500px, 500px) rotate(45deg);
      }
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: center;
        padding: 10px 20px;
      }

      .logo {
        font-size: 20px;
        margin-bottom: 10px;
      }

      nav {
        gap: 15px;
      }

      nav a {
        font-size: 16px;
      }

      .php-effect {
        font-size: 80px;
      }

      .galaxy, .orbit-container {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" onclick="window.location.href='index.html'">Vitor Girotto</div>
    <nav>
      <a href="index.html">Sobre</a>
      <a href="assuntos.html">Assuntos</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <section class="main-section">
    <span class="php-effect" id="phpText">PHP</span>
  </section>

  <div class="stars" id="stars-container"></div>

  <div class="orbit-container">
    <div class="planet orbit1"></div>
    <div class="planet orbit2"></div>
  </div>

  <div class="shooting-stars" id="shootingStars"></div>

  <div class="galaxy"></div>

  <script>
    // Estrelas fixas
    const starContainer = document.getElementById('stars-container');
    for (let i = 0; i < 120; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      star.style.top = `${Math.random() * 100}%`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.animationDelay = `${Math.random() * 5}s`;
      starContainer.appendChild(star);
    }

    // Movimento com mouse
    const phpText = document.getElementById('phpText');
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 30;
      const y = (e.clientY / window.innerHeight - 0.5) * -30;
      phpText.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
    });

    // Estrelas cadentes contínuas
    const shootingStarsContainer = document.getElementById('shootingStars');
    function createShootingStar() {
      const star = document.createElement('div');
      star.classList.add('shooting-star');
      star.style.top = `${Math.random() * window.innerHeight}px`;
      star.style.left = `${Math.random() * window.innerWidth}px`;
      shootingStarsContainer.appendChild(star);
      setTimeout(() => star.remove(), 1000);
    }

    function launchRandomShootingStar() {
      createShootingStar();
      const next = Math.random() * 5000 + 3000;
      setTimeout(launchRandomShootingStar, next);
    }

    launchRandomShootingStar();
  </script>
</body>
</html>
